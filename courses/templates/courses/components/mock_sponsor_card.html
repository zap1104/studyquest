{% load static %}

<aside class="dashboard-sponsor-card" aria-label="Sponsored placement demonstration">
    <div class="sponsor-label">
        <span class="sponsor-sparkle" aria-hidden="true">✦</span>
        <span>Sponsored Placement Demo</span>
    </div>

    <!-- 9:16 Frame with Hover Shield -->
    <div class="sponsor-media-frame">
        <div class="sponsor-video-shield" aria-hidden="true"></div>
        <video
            id="sponsor-video"
            class="sponsor-video"
            autoplay
            muted
            loop
            playsinline
            disablePictureInPicture
            disableRemotePlayback
            controlsList="nodownload noplaybackrate nofullscreen noremoteplayback"
            tabindex="-1"
            aria-hidden="true"
            preload="auto"
            poster="{% static 'courses/images/ads/study_fuel_poster.png' %}"
        >
            <source src="{% static 'courses/videos/ads/studyfuel_loop.mp4' %}" type="video/mp4">
        </video>
    </div>

    <div class="sponsor-body">
        <div class="sponsor-tag-row">
            <span class="sponsor-pill">Blue Citrus</span>
        </div>
        <h3 class="sponsor-product-title">StudyFuel Focus</h3>
        <p class="sponsor-desc">A refreshing companion for your next study session.</p>

        <button type="button" class="btn btn-secondary btn-sm sponsor-cta" >
            View Sample Offer
        </button>

    </div>
</aside>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const video = document.getElementById('sponsor-video');
        if (!video) return;

        video.muted = true;
        video.defaultMuted = true;

        const attemptPlay = () => {
            const p = video.play();
            if (p !== undefined) {
                p.catch(() => {
                    const resume = () => {
                        video.play();
                        document.removeEventListener('click', resume);
                    };
                    document.addEventListener('click', resume, { once: true });
                });
            }
        };

        attemptPlay();

        video.addEventListener('ended', () => {
            video.currentTime = 0;
            video.play();
        });

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            video.pause();
        }

    });
</script>
